[package]
name = "sly2_recomp"
version = "0.1.0"
edition = "2024"

[dependencies]
sly2_db = { path = "vendor/sly2_db" }
bevy_ecs = "0.20.0"
bevy_app = { version = "0.20.0", default-features = false }
log = "0.4"
sha2 = "0.11.0"
# WP-J16: FMV (PSS = MPEG-PS) MPEG-2 video decode
na_mpeg2_decoder = { version = "0.1.0", default-features = false }

[dependencies.bevy]
version = "0.20.0"
optional = true
default-features = false
features = ["default_app", "bevy_gilrs", "3d_bevy_render", "bevy_sprite", "bevy_sprite_render", "bevy_winit", "bevy_window", "std", "multi_threaded", "png", "tonemapping_luts", "zstd_rust", "bevy_audio", "wav"]

[features]
game = ["dep:bevy"]
# Global ray-traced illumination (Bevy Solari). Normal graphics option at runtime; feature only gates the dependency.
rt = ["game", "bevy/bevy_solari"]

[[bin]]
name = "game"
path = "src/bin/game.rs"
required-features = ["game"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WP-J3: decode captured screenshots in tests (already in the lock via bevy)
png = "0.18"
